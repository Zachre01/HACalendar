# HACS / validate

# Optional: run HACS action validation against this plugin repo.
# Does not publish a release.

name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          # Repo description/topics are org metadata; ignore so card PRs aren't blocked.
          # Space-separated (hacs/action requirement).
          ignore: topics description
