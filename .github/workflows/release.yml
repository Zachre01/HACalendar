name: Release

# Build dist/ha-calendar-card.js and attach it as a GitHub Release asset.
# HACS plugins expect the asset basename to match hacs.json "filename".
# Do not use zip_release for plugins.

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/publish (e.g. v0.4.0). Leave empty to rebuild the latest tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build
          test -f dist/ha-calendar-card.js
          test -f dist/HACalendar.js

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi
          if [ -z "$TAG" ]; then
            echo "No tag available. Push a version tag (v0.4.0) or pass workflow_dispatch.tag."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/ha-calendar-card.js
            dist/HACalendar.js
            dist/ha-calendar-card.js.map
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
